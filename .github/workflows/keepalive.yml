# Pings the public Puzzly API health endpoint so Render's free web service
# does not sleep after ~15 minutes of idle. No secrets; URL is public.
name: Keep puzzly-api awake

on:
  schedule:
    # Offset minutes (avoid :00/:05/:10 pileups). Gaps stay under Render's ~15m sleep.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping healthz
        run: |
          set -euo pipefail
          URL="https://puzzly-api.onrender.com/api/healthz"
          for i in 1 2 3 4 5; do
            echo "Attempt $i: GET $URL"
            if curl -fsS --max-time 60 -o /tmp/healthz.body -w "HTTP %{http_code} in %{time_total}s\n" "$URL"; then
              echo "Body:"
              cat /tmp/healthz.body
              echo
              exit 0
            fi
            echo "Attempt $i failed; sleeping 15s"
            sleep 15
          done
          echo "All attempts failed"
          exit 1
