# Keeps this public repo "active" so GitHub does not disable the scheduled
# keepalive workflow after ~60 days of inactivity. No secrets.
name: Monthly activity stamp

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  stamp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump activity stamp
        run: |
          set -euo pipefail
          mkdir -p .keepalive
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive/last-activity.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive/last-activity.txt
          git commit -m "chore: monthly activity stamp to keep schedule enabled" || exit 0
          git push
